topics:
  - name: "Agent Memory"
    keywords: ["agent memory", "memory-augmented agent", "memory management", "long-horizon memory", "episodic memory", "RL memory", "Memory-R1", "memgpt"]
    description: "Active memory management (ADD/UPDATE/DELETE), memory distillation, reinforcement learning for agent memory, and long-horizon dialog consistency."
  - name: "Decision Model"
    keywords: ["decision model", "deliberative reasoning", "autothink", "test-time compute", "world model decision", "agent planning", "policy optimization"]
    description: "Deliberative decision-making, test-time reasoning search, calibrated decision policies, and world model planning for autonomous agents."
  - name: "Multi-Agent System (MAS)"
    keywords: ["multi-agent system", "multi-agent", "MAS", "agent collaboration", "adversarial agents", "agent communication", "cooperative AI"]
    description: "Multi-agent cooperation, role specialization, communication protocols, adversarial co-evolution, and multi-agent coordination frameworks."
  - name: "Reinforcement Learning (RL)"
    keywords: ["reinforcement learning", "RL", "PPO", "GRPO", "outcome-driven reward", "policy gradient", "agent RL", "actor-critic"]
    description: "Outcome-driven reward mechanisms, reinforcement learning from scratch or minimal seed data, test-time policy search, and agent self-alignment."
  - name: "Knowledge Graph & Baseline"
    keywords: ["knowledge graph", "knowledge graph construction", "agent benchmark", "memory benchmark", "KG agent", "HotpotQA"]
    description: "Foundational and classical knowledge graph construction, structured reasoning, and multi-agent memory benchmarks."

zotero:
  user_id: ${oc.env:ZOTERO_ID,null}
  api_key: ${oc.env:ZOTERO_KEY,null}
  include_path: null

email:
  sender: ${oc.env:SENDER,null}
  receiver: ${oc.env:RECEIVER,null}
  smtp_server: ${oc.env:SMTP_SERVER,smtp.qq.com}
  smtp_port: ${oc.env:SMTP_PORT,465}
  sender_password: ${oc.env:SENDER_PASSWORD,null}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY,null}
    base_url: ${oc.env:OPENAI_API_BASE,https://api.openai.com/v1}
  api_mode: chat_completion
  generation_kwargs:
    model: ${oc.env:OPENAI_MODEL,gpt-4o-mini}
  language: Chinese

source:
  arxiv:
    category: ["cs.AI", "cs.LG", "cs.CL"]
  huggingface:
    limit: 30
  semantic_scholar:
    queries:
      - "agent memory"
      - "decision model agent"
      - "multi-agent system MAS"
      - "reinforcement learning agent memory"
      - "knowledge graph construction agent"
      - "agent benchmark evaluation"
    date_range: "2025:2026"
    seed_papers:
      - "ARXIV:2310.08560"
      - "ARXIV:2304.03442"
      - "ARXIV:2303.11366"
      - "ARXIV:2002.00388"
    limit_per_query: 10
    seed_limit: 8
    api_key: ${oc.env:SEMANTIC_SCHOLAR_API_KEY,null}

feishu:
  app_id: ${oc.env:FEISHU_APP_ID,cli_aa45806405781bb5}
  app_secret: ${oc.env:FEISHU_APP_SECRET,null}
  daily_folder_token: ${oc.env:FEISHU_DAILY_FOLDER_TOKEN,LOCNf9C7XleQwsdMUkdcZeidnYs}
  notes_folder_token: ${oc.env:FEISHU_NOTES_FOLDER_TOKEN,null}
  wiki_space_id: ${oc.env:FEISHU_WIKI_SPACE_ID,7696863309156387850}
  daily_parent_node_token: ${oc.env:FEISHU_DAILY_PARENT_NODE_TOKEN,Wxtews8vJiquKskaCYucAw7un8f}
  notes_parent_node_token: ${oc.env:FEISHU_NOTES_PARENT_NODE_TOKEN,IwxFw1Ioui3TpBkrtsMcEbqanIb}
  master_index_node_token: ${oc.env:FEISHU_MASTER_INDEX_NODE_TOKEN,M7oBwK0LuioCR4kzSNVcj8ACneb}
  tag_graph_node_token: ${oc.env:FEISHU_TAG_GRAPH_NODE_TOKEN,TQHTwgsrhi1GmZkNX3McyBkGnse}
  dry_run: ${oc.env:FEISHU_DRY_RUN,false}

paper_store:
  path: "data/paper_store.json"

executor:
  debug: ${oc.env:DEBUG,false}
  max_paper_num: 15
  total_daily_quota: 15
  source: ['arxiv', 'huggingface', 'semantic_scholar']
  reranker: local

news_and_trends:
  enabled: ${oc.env:TRENDS_ENABLED,true}
  max_items: 4
  min_github_stars: 50
  github:
    enabled: true
    topics: ["ai-agent", "agent-memory", "decision-model", "multi-agent-systems", "reinforcement-learning", "knowledge-graph"]
    days_back: 7
  news:
    enabled: true
    min_hn_points: 60
  tags:
    - name: "Memory"
      keywords: ["memory", "episodic memory", "working memory", "memgpt", "long-context", "memory management", "memory-r1"]
    - name: "DecisionModel"
      keywords: ["decision", "decision model", "planning", "autothink", "reasoning", "policy", "world model"]
    - name: "MAS"
      keywords: ["multi-agent", "multiagent", "cooperative agent", "swarm", "agent communication", "adversarial agent", "mas"]
    - name: "RL"
      keywords: ["reinforcement learning", "ppo", "grpo", "reward", "policy gradient", "q-learning", "actor-critic"]
    - name: "Benchmark"
      keywords: ["benchmark", "dataset", "eval-suite", "hotpotqa", "longevalmem", "evaluation"]
    - name: "KnowledgeGraph"
      keywords: ["knowledge graph", "kg", "entity linking", "relation extraction", "transe"]
    - name: "OpenSource"
      keywords: ["open-weights", "weights", "llama", "deepseek", "vllm", "sglang", "ollama"]
    - name: "Breaking"
      keywords: ["announces", "release", "launched", "breakthrough"]

