  notes_parent_node_token: ${oc.env:FEISHU_NOTES_PARENT_NODE_TOKEN,null}
  master_index_node_token: ${oc.env:FEISHU_MASTER_INDEX_NODE_TOKEN,null}
  tag_graph_node_token: ${oc.env:FEISHU_TAG_GRAPH_NODE_TOKEN,null}
  engineering_parent_node_token: ${oc.env:FEISHU_ENGINEERING_PARENT_NODE_TOKEN,null}
  dry_run: false

console:
  enabled: true
  provider: ${oc.env:CONSOLE_PROVIDER,auto}
  node_token: ${oc.env:FEISHU_CONSOLE_NODE_TOKEN,null}
  skill_path: ${oc.env:CONSOLE_SKILL_PATH,null}
  template_path: ${oc.env:CONSOLE_TEMPLATE_PATH,null}
  tags: []
  questions: []

obsidian:
  enabled: ${oc.env:OBSIDIAN_ENABLED,false}
  vault_path: ${oc.env:OBSIDIAN_VAULT_PATH,null}
  include_folders: null
  notes_folder: ${oc.env:OBSIDIAN_NOTES_FOLDER,Literature}
  console_path: ${oc.env:OBSIDIAN_CONSOLE_PATH,null}

notion:
  enabled: ${oc.env:NOTION_ENABLED,false}
  token: ${oc.env:NOTION_TOKEN,null}
  database_id: ${oc.env:NOTION_DATABASE_ID,null}
  console_page_id: ${oc.env:NOTION_CONSOLE_PAGE_ID,null}

paper_store:
  path: "data/paper_store.json"

executor:
  debug: false
  max_paper_num: ${oc.env:MAX_PAPER_NUM,15}
  total_daily_quota: ${oc.env:TOTAL_DAILY_QUOTA,15}
  source: ['arxiv', 'huggingface', 'semantic_scholar']
  reranker: local

news_and_trends:
  enabled: ${oc.env:TRENDS_ENABLED,true}
  max_items: 4
  min_github_stars: 50
  github:
    enabled: true
    topics: ["ai-agent", "agent-memory", "decision-model", "multi-agent-systems", "reinforcement-learning", "knowledge-graph", "agent-harness", "self-improvement"]
    days_back: 7
  news:
    enabled: true
    min_hn_points: 60
  tags:
    - name: "Memory"
      keywords: ["memory", "episodic memory", "working memory", "memgpt", "long-context", "memory management", "memory-r1"]
    - name: "DecisionModel"
      keywords: ["decision", "decision model", "planning", "autothink", "reasoning", "policy", "world model"]
    - name: "MAS"
      keywords: ["multi-agent", "multiagent", "cooperative agent", "swarm", "agent communication", "adversarial agent", "mas"]
    - name: "RL"
      keywords: ["reinforcement learning", "ppo", "grpo", "reward", "policy gradient", "q-learning", "actor-critic"]
    - name: "Benchmark"
      keywords: ["benchmark", "dataset", "eval-suite", "hotpotqa", "longevalmem", "evaluation"]
    - name: "KnowledgeGraph"
      keywords: ["knowledge graph", "kg", "entity linking", "relation extraction", "transe"]
    - name: "Harness"
      keywords: ["harness", "agent harness", "eval harness", "sandbox", "test environment", "swe-bench", "runtime"]
    - name: "RSI"
      keywords: ["rsi", "recursive self-improvement", "self-improving", "self-evolving", "self-improvement", "self-correction", "self-training"]
    - name: "OpenSource"
      keywords: ["open-weights", "weights", "llama", "deepseek", "vllm", "sglang", "ollama"]
    - name: "Breaking"
      keywords: ["announces", "release", "launched", "breakthrough"]

filter:
  enabled: ${oc.env:FILTER_ENABLED,true}
  min_citations: 5

research:
  enabled: ${oc.env:RESEARCH_ENABLED,true}
  multi_hop: ${oc.env:RESEARCH_MULTI_HOP,true}
  max_seeds: 4
  synthesis: ${oc.env:RESEARCH_SYNTHESIS,true}
  next_questions: ${oc.env:RESEARCH_NEXT_QUESTIONS,true}
  baselines: ${oc.env:RESEARCH_BASELINES,true}
  auto_backlink: ${oc.env:RESEARCH_AUTO_BACKLINK,true}
  inline_annotations: ${oc.env:RESEARCH_INLINE_ANNOTATIONS,true}
  adversarial_queries: ${oc.env:RESEARCH_ADVERSARIAL_QUERIES,true}
  full_text_ar5iv: ${oc.env:RESEARCH_FULL_TEXT_AR5IV,false}
  state_path: "data/research_state.json"
  negative_similarity: ${oc.env:RESEARCH_NEGATIVE_SIMILARITY,0.6}
  negative_penalty: ${oc.env:RESEARCH_NEGATIVE_PENALTY,1.0}
  judge_weight: ${oc.env:RESEARCH_JUDGE_WEIGHT,0.6}
  max_brief_questions: ${oc.env:RESEARCH_MAX_BRIEF_QUESTIONS,8}
  trace: ${oc.env:RESEARCH_TRACE,true}
  min_qa_score: ${oc.env:RESEARCH_MIN_QA_SCORE,6}
  deep_read_min_qa: ${oc.env:RESEARCH_DEEP_READ_MIN_QA,7}
  deep_read_quota: ${oc.env:RESEARCH_DEEP_READ_QUOTA,3}
  quick_radar_quota: ${oc.env:RESEARCH_QUICK_RADAR_QUOTA,4}
  qa_workers: ${oc.env:RESEARCH_QA_WORKERS,20}
  enrich_workers: ${oc.env:RESEARCH_ENRICH_WORKERS,6}


