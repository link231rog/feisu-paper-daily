topics:
  - name: "Agent Memory"
    keywords: ["agent memory", "memory-augmented agent", "memory management", "long-horizon memory", "episodic memory", "RL memory", "Memory-R1", "memgpt"]
    description: "Active memory management (ADD/UPDATE/DELETE), memory distillation, reinforcement learning for agent memory, and long-horizon dialog consistency."
  - name: "Decision Model"
    keywords: ["decision model", "deliberative reasoning", "autothink", "test-time compute", "world model decision", "agent planning", "policy optimization"]
    description: "Deliberative decision-making, test-time reasoning search, calibrated decision policies, and world model planning for autonomous agents."
  - name: "Multi-Agent System (MAS)"
    keywords: ["multi-agent system", "multi-agent", "MAS", "agent collaboration", "adversarial agents", "agent communication", "cooperative AI"]
    description: "Multi-agent cooperation, role specialization, communication protocols, adversarial co-evolution, and multi-agent coordination frameworks."
  - name: "Reinforcement Learning (RL)"
    keywords: ["reinforcement learning", "RL", "PPO", "GRPO", "outcome-driven reward", "policy gradient", "agent RL", "actor-critic"]
    description: "Outcome-driven reward mechanisms, reinforcement learning from scratch or minimal seed data, test-time policy search, and agent self-alignment."
  - name: "Knowledge Graph & Baseline"
    keywords: ["knowledge graph", "knowledge graph construction", "agent benchmark", "memory benchmark", "KG agent", "HotpotQA"]
    description: "Foundational and classical knowledge graph construction, structured reasoning, and multi-agent memory benchmarks."
  - name: "Agent Harness"
    keywords: ["agent harness", "evaluation harness", "agent testing harness", "benchmark harness", "agent sandbox", "execution environment", "SWE-bench harness", "agent runtime"]
    description: "Agent evaluation harnesses, reproducible test environments, sandbox execution runtimes, and standardized interaction benchmarks for autonomous agents."
  - name: "Recursive Self-Improvement (RSI)"
    keywords: ["recursive self-improvement", "RSI", "self-improving agent", "self-evolving agent", "self-correction", "self-training", "autonomous self-improvement", "self-play"]
    description: "Recursive self-improvement (RSI), autonomous self-evolving agents, self-correction feedback loops, self-distillation, and test-time self-alignment."

zotero:
  user_id: ${oc.env:ZOTERO_ID,null}
  api_key: ${oc.env:ZOTERO_KEY,null}
  include_path: null
  console_note_key: ${oc.env:ZOTERO_CONSOLE_NOTE_KEY,null}

email:
  enabled: ${oc.env:EMAIL_ENABLED,true}
  sender: ${oc.env:SENDER,null}
  receiver: ${oc.env:RECEIVER,null}
  smtp_server: ${oc.env:SMTP_SERVER,smtp.qq.com}
  smtp_port: ${oc.env:SMTP_PORT,465}
  sender_password: ${oc.env:SENDER_PASSWORD,null}

wechat:
  enabled: ${oc.env:WECHAT_ENABLED,false}
  app_id: ${oc.env:WECHAT_APP_ID,null}
  app_secret: ${oc.env:WECHAT_APP_SECRET,null}
  thumb_media_id: ${oc.env:WECHAT_THUMB_MEDIA_ID,null}
  cover_path: ${oc.env:WECHAT_COVER_PATH,null}
  author: ${oc.env:WECHAT_AUTHOR,Feishu Paper Daily}
  article_modes: ["digest", "deep_read", "topic_review"]
  content_source_url: ${oc.env:WECHAT_CONTENT_SOURCE_URL,null}

telegram:
  enabled: ${oc.env:TELEGRAM_ENABLED,false}
  bot_token: ${oc.env:TELEGRAM_BOT_TOKEN,null}
  chat_id: ${oc.env:TELEGRAM_CHAT_ID,null}
  message_thread_id: ${oc.env:TELEGRAM_MESSAGE_THREAD_ID,null}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY,null}
    keys: ${oc.env:LLM_API_KEYS,null}
    base_url: ${oc.env:OPENAI_API_BASE,${oc.env:TRANSLATION_API_BASE,https://openrouter.ai/api/v1}}
    max_concurrency: ${oc.env:LLM_MAX_CONCURRENCY,8}
  api_mode: chat_completion
  generation_kwargs:
    model: ${oc.env:OPENAI_MODEL,${oc.env:TRANSLATION_MODEL,nvidia/nemotron-3-ultra-550b-a55b:free}}
  backup_model: ${oc.env:OPENAI_BACKUP_MODEL,${oc.env:TRANSLATION_BACKUP_MODEL,xingchen-agi/xing4.0-29b-a4b:free}}
  language: Chinese

translation:
  enabled: ${oc.env:TRANSLATION_ENABLED,true}
  api_base: ${oc.env:TRANSLATION_API_BASE,https://openrouter.ai/api/v1}
  api_key: ${oc.env:TRANSLATION_API_KEY,null}
  backup_api_key: ${oc.env:TRANSLATION_BACKUP_API_KEY,null}
  model: ${oc.env:TRANSLATION_MODEL,nvidia/nemotron-3-ultra-550b-a55b:free}
  backup_model: ${oc.env:TRANSLATION_BACKUP_MODEL,xingchen-agi/xing4.0-29b-a4b:free}
  layout: ${oc.env:TRANSLATION_LAYOUT,quote}
  batch_size: ${oc.env:TRANSLATION_BATCH_SIZE,5}

reranker:
  recency_boost: ${oc.env:RERANKER_RECENCY_BOOST,0.5}
  venue_boost: ${oc.env:RERANKER_VENUE_BOOST,0.5}
  citation_boost_max: ${oc.env:RERANKER_CITATION_BOOST_MAX,1.0}
  recency_years: ${oc.env:RERANKER_RECENCY_YEARS,null}

source:
  arxiv:
    category: ["cs.AI", "cs.LG", "cs.CL"]
  huggingface:
    limit: 30
  semantic_scholar:
    queries:
      - "agent memory"
      - "decision model agent"
      - "multi-agent system MAS"
      - "reinforcement learning agent memory"
      - "knowledge graph construction agent"
      - "agent benchmark evaluation"
      - "agent harness evaluation benchmark"
      - "recursive self-improvement agent RSI"
    date_range: "2025:2026"
    seed_papers:
      - "ARXIV:2310.08560"
      - "ARXIV:2304.03442"
      - "ARXIV:2303.11366"
      - "ARXIV:2002.00388"
    limit_per_query: 10
    seed_limit: 8
    api_key: ${oc.env:SEMANTIC_SCHOLAR_API_KEY,null}
  openreview:
    queries:
      - "agent memory"
      - "multi-agent reinforcement learning"
      - "test-time compute reasoning"
    limit_per_query: 10
  dblp:
    queries:
      - "agent memory"
      - "multi-agent system"
    limit_per_query: 10
    min_year: 2025

feishu:
  app_id: ${oc.env:FEISHU_APP_ID,null}
  app_secret: ${oc.env:FEISHU_APP_SECRET,null}
  daily_folder_token: ${oc.env:FEISHU_DAILY_FOLDER_TOKEN,null}
  notes_folder_token: ${oc.env:FEISHU_NOTES_FOLDER_TOKEN,null}
