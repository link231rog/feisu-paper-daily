topics: null # List of research topics or directions. Example: [{"name": "LLM Agents", "keywords": ["agent", "reasoning"], "description": "LLM planning, tool-use, multi-agent"}]

zotero:
  user_id: null # User ID of your Zotero account (optional if topics configured).
  api_key: null # A Zotero API key with read access.
  include_path: null # A list of glob patterns marking the Zotero collections that should be included. Example: ["2026/survey/**","2026/reading-group/**"]
  ignore_path: null # A list of glob patterns marking the Zotero collections that should be excluded. Example: ["2026/ignore/**","archive/**"]
  console_note_key: null # Zotero note key used as the console when console.provider is zotero

source:
  arxiv:
    category: null # The categories of target arxiv papers. Example: ["cs.AI","cs.CV","cs.LG","cs.CL"]
    include_cross_list: false # Whether to include arXiv cross-list papers in subscribed categories. Example: true
  biorxiv:
    category: null # The categories of target biorxiv papers.
  medrxiv:
    category: null # The categories of target medrxiv papers.
  chemrxiv:
    include_new_versions: false
  huggingface:
    date: null # Target date (YYYY-MM-DD), null for latest
    limit: 50 # Maximum papers to fetch from Hugging Face
  semantic_scholar:
    queries: null # List of search queries. Example: ["large language models", "agent alignment"]
    seed_papers: null # List of seed paper identifiers (DOI, ArXiv ID, or S2 paperId)
    date_range: "2025:2026" # Publication year or range, e.g. "2025:2026" or "2026"
    limit_per_query: 15
    seed_limit: 10
    api_key: null # Semantic Scholar API key (optional, avoids 429 rate limit)

email:
  enabled: true
  sender: null
  receiver: null # Comma-separated addresses are supported
  smtp_server: null
  smtp_port: 465
  sender_password: null

wechat:
  enabled: false # Create a draft for review; never auto-publish
  app_id: null
  app_secret: null
  thumb_media_id: null # Existing permanent image material ID; avoids repeated uploads
  cover_path: null # Used only when thumb_media_id is not configured
  author: "Feishu Paper Daily"
  content_source_url: null # Public URL only; do not expose private Feishu documents

llm:
  api:
    key: null # API Key of your LLM API. Example: sk-xxx
    keys: null # Optional list of API keys, rotated when one is rate limited
    base_url: null # API URL of your LLM API. Example: https://api.openai.com/v1
  api_mode: chat_completion # The LLM API to use. Options: chat_completion or response.
  generation_kwargs:
    max_tokens: 16384
    model: gpt-4o-mini
  language: Chinese # Preferred language for the TL;DR. Example: Chinese

reranker:
  recency_boost: 0.5 # Bonus for papers in recency_years
  venue_boost: 0.5 # Bonus for top venues
  citation_boost_max: 1.0 # Cap for log-scaled citation bonus
  recency_years: null # Defaults to [current year, current year - 1]
  local:
    model: jinaai/jina-embeddings-v5-text-nano-retrieval
    encode_kwargs:
      task: retrieval
      prompt_name: document
  api:
    key: null
    base_url: null
    model: null
    batch_size: null

feishu:
  app_id: null
  app_secret: null
  daily_folder_token: null
  notes_folder_token: null
  wiki_space_id: null
  daily_parent_node_token: null
  candidate_node_token: null
  notes_parent_node_token: null
  master_index_node_token: null
  tag_graph_node_token: null
  idea_parent_node_token: null
  experiment_parent_node_token: null
  synthesis_parent_node_token: null
  engineering_parent_node_token: null
  dry_run: false
  create_tasks: true

console:
  enabled: true
  provider: auto # auto | feishu | obsidian | notion | zotero | config
  node_token: null # Feishu Wiki node of the recommendation console document
  tags: null # Active research tags, overridden by the console provider when set
  questions: null # Tracked questions, overridden by the console provider when set

obsidian:
  enabled: false
  vault_path: null # Local Obsidian vault directory
  include_folders: null # Optional list of vault-relative folders to read
  console_path: null # Vault-relative note used as the console, e.g. "Console.md"

notion:
  enabled: false
  token: null # Notion integration token
  database_id: null # Notion database holding your reading list
  console_page_id: null # Notion page used as the console

paper_store:
  path: "data/paper_store.json"

executor:
  debug: false
  send_empty: false
  max_paper_num: 15
  total_daily_quota: 15
  source: ['arxiv', 'huggingface', 'semantic_scholar']
  reranker: local
  ingest_only: false

news_and_trends:
  enabled: false
  max_items: 4
  min_github_stars: 50
  github:
    enabled: true
    topics: ["llm", "ai-agent", "diffusion"]
    days_back: 7
    limit_per_topic: 10
  news:
    enabled: true
    min_hn_points: 60
    feeds:
      - name: "Hugging Face Blog"
        url: "https://huggingface.co/blog/feed.xml"
      - name: "Google DeepMind"
        url: "https://deepmind.google/blog/rss.xml"
  tags:
    - name: "Agent"
      keywords: ["agent", "multi-agent", "workflow", "tool-use", "browser-agent", "autonomous"]
    - name: "OpenSource"
      keywords: ["open-weights", "weights", "llama", "deepseek", "vllm", "sglang", "ollama"]
    - name: "Diffusion"
      keywords: ["diffusion", "video generation", "flux", "image generation", "lora"]
    - name: "Breaking"
      keywords: ["announces", "release", "launched", "benchmark", "breakthrough"]

