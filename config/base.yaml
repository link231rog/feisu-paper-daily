research:
  enabled: true
  multi_hop: true # Chase citations of promising candidates for a second retrieval hop
  max_seeds: 4
  synthesis: true # Write a per-question brief each run
  next_questions: true # Propose follow-up questions into the console
  state_path: "data/research_state.json"
  # Ranking: library taste vs tracked-question fit
  weight_taste: 0.5
  weight_fit: 0.5
  qa_workers: 20 # Concurrent LLM calls when scoring candidates
  enrich_workers: 6 # Parallel per-paper baseline + annotation pass
  judge: true # One comparative LLM pass over the top candidates
  max_judge: 25
  judge_weight: 0.6 # 0 = keep fused order, 1 = trust the judge fully
  max_brief_questions: 8 # Questions that get a per-run evidence brief
  trace: true # Write data/last_run_trace.json with scores and selection reasons
  trace_path: "data/last_run_trace.json"
  per_question_cap: 6 # A single question may not dominate the daily list
  exploration_slots: 2 # Reserve slots for strong library matches no question asked for
  # Baseline extraction, attribution, and bi-directional linking
  baselines: true
  auto_backlink: true
  # In-line paragraph highlights, baseline tags, and review critiques
  inline_annotations: true
  # Active adversarial querying
  adversarial_queries: true
  full_text_ar5iv: false # Abstract only for daily report; method/experiments analyzed upon ingestion
  # Discarded-paper negative feedback & MMR diversity
  negative_similarity: 0.6
  negative_penalty: 1.0
  mmr_diversity: true
  mmr_lambda: 0.75
  rerank_by_rubric: true
  min_qa_score: 6
  deep_read_min_qa: 7
  deep_read_quota: 3
  quick_radar_quota: 4


