topics: null # List of research topics or directions. Example: [{"name": "LLM Agents", "keywords": ["agent", "reasoning"], "description": "LLM planning, tool-use, multi-agent"}]

zotero:
  user_id: null # User ID of your Zotero account (optional if topics configured).
  api_key: null # A Zotero API key with read access.
  include_path: null # A list of glob patterns marking the Zotero collections that should be included. Example: ["2026/survey/**","2026/reading-group/**"]
  ignore_path: null # A list of glob patterns marking the Zotero collections that should be excluded. Example: ["2026/ignore/**","archive/**"]
  console_note_key: null # Zotero note key used as the console when console.provider is zotero

source:
  arxiv:
    category: null # The categories of target arxiv papers. Example: ["cs.AI","cs.CV","cs.LG","cs.CL"]
    include_cross_list: false # Whether to include arXiv cross-list papers in subscribed categories. Example: true
  biorxiv:
    category: null # The categories of target biorxiv papers.
  medrxiv:
    category: null # The categories of target medrxiv papers.
  chemrxiv:
    include_new_versions: false
  huggingface:
    date: null # Target date (YYYY-MM-DD), null for latest
    limit: 50 # Maximum papers to fetch from Hugging Face
    enrich_daily_signals: true # Cross-enrich arXiv candidates with HF Daily Papers upvotes and code links
  semantic_scholar:
    queries: null # List of search queries. Example: ["large language models", "agent alignment"]
    seed_papers: null # List of seed paper identifiers (DOI, ArXiv ID, or S2 paperId)
    date_range: "2025:2026" # Publication year or range, e.g. "2025:2026" or "2026"
    limit_per_query: 15
    seed_limit: 10
    api_key: null # Semantic Scholar API key (optional, avoids 429 rate limit)
  openreview:
    queries: null # Optional search terms on OpenReview API v2
    venues: null # Optional venue IDs e.g. ["ICLR.cc/2025/Conference", "NeurIPS.cc/2025/Conference"]
    limit_per_query: 15
  dblp:
    queries: null # Optional search terms on DBLP Publication API
    limit_per_query: 15
    min_year: 2025

email:
  enabled: true
  sender: null
  receiver: null # Comma-separated addresses are supported
  smtp_server: null
  smtp_port: 465
  sender_password: null

wechat:
  enabled: false # Create drafts in WeChat Official Account draft box; never auto-publish
  app_id: null
  app_secret: null
  proxy_url: null # Optional outbound HTTP/HTTPS/SOCKS5 proxy for WeChat API (e.g. http://user:pass@host:port) to pass IP whitelist in GitHub Actions
  api_base: "https://api.weixin.qq.com" # Optional custom proxy/relay base URL
  thumb_media_id: null # Optional existing permanent image material ID; auto-generated if empty
  cover_path: null # Optional local cover path; auto-generates academic cover if empty
  author: "Paper Daily"
  article_modes: ["digest", "deep_read", "topic_review"] # Supported modes: digest | deep_read | topic_review
  content_source_url: null # Public URL only; do not expose private Feishu documents

telegram:
  enabled: false
  bot_token: null
  chat_id: null
  message_thread_id: null
  api_base: "https://api.telegram.org"

audio:
  enabled: false # Generate optional MP3 podcast / academic morning briefing
  mode: "dialogue" # "dialogue" (NotebookLM-style two-speaker podcast) | "briefing" (single-speaker morning briefing)
  use_llm_script: true # Use LLM to polish conversational script when available (falls back to structured template)
  engine: "edge-tts" # "edge-tts" (free neural voices) | "openai" (OpenAI /v1/audio/speech or openai-edge-tts)
  host_voice: "zh-CN-XiaoxiaoNeural"
  guest_voice: "zh-CN-YunxiNeural"
  speech_rate: "+5%"
  turn_pause_ms: 320
  openai_model: "tts-1"
  openai_host_voice: "nova"
  openai_guest_voice: "onyx"
  openai_base_url: null
  openai_api_key: null
  max_papers: 5
  output_dir: "data/audio"
  attach_telegram: true # Send native Telegram audio player message
  attach_email: true # Attach MP3 file to daily report email
  attach_feishu: true # Upload and mount MP3 file block at top of Feishu daily report
  upload_wechat_voice: true # Generate <=60s condensed voice guide and upload to WeChat Official Account voice library

notebooklm:
  enabled: false # Optional Google NotebookLM topic-based library ingestion and native dual-host podcast
  notebook_mode: "persistent" # "persistent" (topic notebook with auto-volume split) | "daily" (daily topic notebook)
  max_sources_per_notebook: 45 # Auto-split threshold before Google's 50-source cap
  generate_audio: true # Automatically generate Google official deep-dive audio overview
  audio_language: "zh" # Language for audio overview (e.g. "zh", "en")
  audio_format: "deep_dive" # "deep_dive" | "brief" | "critique" | "debate"
  audio_length: "default" # "short" | "default" | "long"
  max_topics: 1 # Number of topics to generate audio for per day (conserves Google daily quota)
  output_dir: "data/audio/notebooklm"
  attach_feishu: true
  attach_email: true
  attach_telegram: true

agent_reach:
  enabled: false # Optional external social & multimedia intelligence assembly (Panniantong/Agent-Reach)
  channels: ["bilibili", "youtube", "github"] # Channels to probe for top deep-read papers
  max_papers_to_enrich: 3 # Top N deep-read papers to enrich with external talks/discussions
  fallback_web_reader: true # Use agent-reach read <url> as fallback reader backend
  timeout: 15.0 # Timeout in seconds for individual CLI calls

llm:
  api:
    key: null # API Key of your LLM API. Example: sk-xxx
    keys: null # Optional list of API keys, rotated when one is rate limited
    base_url: null # API URL of your LLM API. Example: https://api.openai.com/v1
    max_concurrency: 12 # In-flight requests per run; higher trips the provider's per-key limit
  api_mode: chat_completion # The LLM API to use. Options: chat_completion or response.
  generation_kwargs:
    max_tokens: 16384
    model: gpt-4o-mini
  language: Chinese # Preferred language for the TL;DR. Example: Chinese

reranker:
  max_sim_alpha: 0.45 # Blend weight between Max single-anchor similarity and Top-K/Time-Decay mean
  top_k_anchors: 5 # Number of top corpus matches for multi-peak similarity
  rocchio_beta: 0.35 # Penalty weight for Rocchio negative prototype feedback
  rocchio_neg_threshold: 0.18 # Minimum similarity to negative prototypes before penalty applies
  mmr_lambda: 0.75 # Maximal Marginal Relevance trade-off (1.0 = pure relevance, 0.0 = pure diversity)
  recency_boost: 0.5 # Bonus for papers in recency_years
  venue_boost: 0.5 # Bonus for top venues
  citation_boost_max: 1.0 # Cap for log-scaled citation bonus
  code_boost: 0.4 # Bonus for papers releasing open-source code repositories
  hf_boost_max: 0.8 # Cap for log-scaled Hugging Face Daily Papers community upvotes bonus
  recency_years: null # Defaults to [current year, current year - 1]
  local:
    model: jinaai/jina-embeddings-v5-text-nano-retrieval
    method: tfidf # tfidf (instant, keyword-based) or embedding (semantic, ~6 min on CI CPU)
    encode_kwargs:
      task: retrieval
      prompt_name: document
  api:
    key: null
    base_url: null
    model: null
    batch_size: null

feishu:
  app_id: null
  app_secret: null
  daily_folder_token: null
  notes_folder_token: null
  wiki_space_id: null
  daily_parent_node_token: null
  notes_parent_node_token: null
  master_index_node_token: null
  tag_graph_node_token: null
  engineering_parent_node_token: null
  dry_run: false
  create_tasks: true

console:
  enabled: true
  provider: auto # auto | feishu | obsidian | notion | zotero | config
  node_token: null # Feishu Wiki node of the recommendation console document
  skill_path: null # Optional path to external custom review Skill (.md)
  template_path: null # Optional path to external custom reading note template (.md)
  tags: null # Active research tags, overridden by the console provider when set
  questions: null # Tracked questions, overridden by the console provider when set
  custom_rules: null
  note_template: null

obsidian:
  enabled: false
  vault_path: null # Local Obsidian vault directory
  include_folders: null # Optional list of vault-relative folders to read
  notes_folder: "Literature" # Vault-relative folder where ingested reading notes are saved
  console_path: null # Vault-relative note used as the console, e.g. "Console.md"

notion:
  enabled: false
  token: null # Notion integration token
  database_id: null # Notion database holding your reading list
  console_page_id: null # Notion page used as the console

paper_store:
  path: "data/paper_store.json"

executor:
  debug: false
  send_empty: false
  max_paper_num: 15
  total_daily_quota: 15
  source: ['arxiv', 'huggingface', 'semantic_scholar']
  reranker: local
  ingest_only: false

news_and_trends:
  enabled: false
  max_items: 4
  min_github_stars: 50
  github:
    enabled: true
    topics: ["llm", "ai-agent", "diffusion"]
    days_back: 7
    limit_per_topic: 10
  news:
    enabled: true
    min_hn_points: 60
    feeds:
      - name: "Hugging Face Blog"
        url: "https://huggingface.co/blog/feed.xml"
      - name: "Google DeepMind"
        url: "https://deepmind.google/blog/rss.xml"
  tags:
    - name: "Agent"
      keywords: ["agent", "multi-agent", "workflow", "tool-use", "browser-agent", "autonomous"]
    - name: "OpenSource"
      keywords: ["open-weights", "weights", "llama", "deepseek", "vllm", "sglang", "ollama"]
    - name: "Diffusion"
      keywords: ["diffusion", "video generation", "flux", "image generation", "lora"]
    - name: "Breaking"
      keywords: ["announces", "release", "launched", "benchmark", "breakthrough"]

