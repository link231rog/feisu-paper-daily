name: Feishu Paper Daily
on:
  workflow_dispatch:
    inputs:
      ingest_only:
        description: 'Only ingest checked papers (skip new retrieval)'
        type: boolean
        default: false
      force_today:
        description: 'Re-run today: re-evaluate papers pushed earlier today'
        type: boolean
        default: false
  repository_dispatch:
    types: [paper-daily, paper_daily, ingest]
  schedule:
    - cron: '15 1 * * *' # 09:15 Beijing Time (01:15 UTC): Daily literature recommendation & ingestion (Once per day)

permissions:
  contents: read

jobs:
  paper-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      # data/ holds paper_store.json (pushed/discarded dedup) and research_state.json.
      # Runners are ephemeral, so restore the newest snapshot and save a new one every run.
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: paper-daily-state-${{ github.run_id }}
          restore-keys: |
            paper-daily-state-

      - name: Run Paper Daily pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEYS: ${{ secrets.LLM_API_KEYS }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DAILY_FOLDER_TOKEN: ${{ secrets.FEISHU_DAILY_FOLDER_TOKEN }}
          FEISHU_NOTES_FOLDER_TOKEN: ${{ secrets.FEISHU_NOTES_FOLDER_TOKEN }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
          FEISHU_DAILY_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_DAILY_PARENT_NODE_TOKEN }}
          FEISHU_NOTES_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_NOTES_PARENT_NODE_TOKEN }}
          FEISHU_MASTER_INDEX_NODE_TOKEN: ${{ secrets.FEISHU_MASTER_INDEX_NODE_TOKEN }}
          FEISHU_TAG_GRAPH_NODE_TOKEN: ${{ secrets.FEISHU_TAG_GRAPH_NODE_TOKEN }}
          FEISHU_ENGINEERING_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_ENGINEERING_PARENT_NODE_TOKEN }}
          FEISHU_CONSOLE_NODE_TOKEN: ${{ secrets.FEISHU_CONSOLE_NODE_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          NOTION_CONSOLE_PAGE_ID: ${{ vars.NOTION_CONSOLE_PAGE_ID }}
          CONSOLE_PROVIDER: ${{ vars.CONSOLE_PROVIDER || 'auto' }}
          FEISHU_DRY_RUN: "false"
          FORCE_RERUN_TODAY: ${{ (inputs.force_today || github.event.client_payload.force_today) && 'true' || 'false' }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          TRANSLATION_ENABLED: ${{ vars.TRANSLATION_ENABLED || 'true' }}
          TRANSLATION_ENGINE: ${{ vars.TRANSLATION_ENGINE || 'web' }}
          TRANSLATION_CONCURRENCY: ${{ vars.TRANSLATION_CONCURRENCY || '5' }}
          TRANSLATION_LAYOUT: ${{ vars.TRANSLATION_LAYOUT || 'quote' }}
          TRANSLATION_API_BASE: ${{ vars.TRANSLATION_API_BASE || 'https://openrouter.ai/api/v1' }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_BACKUP_API_KEY: ${{ secrets.TRANSLATION_BACKUP_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          TRANSLATION_BACKUP_MODEL: ${{ vars.TRANSLATION_BACKUP_MODEL || 'xingchen-agi/xing4.0-29b-a4b:free' }}
          CUSTOM_CONFIG: ${{ secrets.CUSTOM_CONFIG }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'true' }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER || 'smtp.qq.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          WECHAT_ENABLED: ${{ vars.WECHAT_ENABLED || 'false' }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
          WECHAT_API_BASE: ${{ vars.WECHAT_API_BASE || 'https://api.weixin.qq.com' }}
          WECHAT_THUMB_MEDIA_ID: ${{ secrets.WECHAT_THUMB_MEDIA_ID }}
          WECHAT_AUTHOR: ${{ vars.WECHAT_AUTHOR || 'Feishu Paper Daily' }}
          WECHAT_CONTENT_SOURCE_URL: ${{ vars.WECHAT_CONTENT_SOURCE_URL }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTEBOOKLM_ENABLED: ${{ vars.NOTEBOOKLM_ENABLED || 'false' }}
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_COOKIES: ${{ secrets.NOTEBOOKLM_COOKIES }}
          NOTEBOOKLM_MODE: ${{ vars.NOTEBOOKLM_MODE || 'persistent' }}
          NOTEBOOKLM_AUDIO_LANGUAGE: ${{ vars.NOTEBOOKLM_AUDIO_LANGUAGE || 'zh' }}
          POSTER_ENABLED: ${{ vars.POSTER_ENABLED || 'false' }}
          POSTER_API_KEY: ${{ secrets.POSTER_API_KEY }}
          POSTER_API_BASE: ${{ vars.POSTER_API_BASE || 'https://sub.umapis.com/v1' }}
          POSTER_MODEL: ${{ vars.POSTER_MODEL || 'gpt-image-2.5-sunburst' }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%s\n" "$CUSTOM_CONFIG" > config/custom.yaml
          fi

          # Schedule:
          # - 09:15 Beijing Time (01:15 UTC): Daily single push (full pipeline)
          IS_INGEST_ONLY="${{ inputs.ingest_only || github.event.client_payload.ingest_only }}"
          if [ "$IS_INGEST_ONLY" = "true" ] || [ "${{ github.event.action }}" = "ingest" ]; then
            echo "Running in ingest-only mode (external dispatch/manual)"
            export INGEST_ONLY="true"
          else
            echo "Running daily full pipeline at $(date)"
          fi

          uv run paper_daily/main.py

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: paper-daily-state-${{ github.run_id }}
