name: Feishu Paper Daily
on:
  workflow_dispatch:
    inputs:
      ingest_only:
        description: 'Only ingest checked papers (skip new retrieval)'
        type: boolean
        default: false
      diagnose:
        description: 'Only probe Feishu credentials'
        type: boolean
        default: false
  schedule:
    - cron: '0 1,7,11 * * *' # 09:00, 15:00, 19:00 Beijing Time (01:00, 07:00, 11:00 UTC)

permissions:
  contents: read

jobs:
  paper-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Diagnose Feishu
        if: inputs.diagnose
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DAILY_FOLDER_TOKEN: ${{ secrets.FEISHU_DAILY_FOLDER_TOKEN }}
          FEISHU_DAILY_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_DAILY_PARENT_NODE_TOKEN }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request, urllib.error
          for n in ("FEISHU_APP_ID","FEISHU_APP_SECRET","FEISHU_DAILY_FOLDER_TOKEN","FEISHU_DAILY_PARENT_NODE_TOKEN","FEISHU_WIKI_SPACE_ID"):
              v = os.environ.get(n, "")
              print(n, "len", len(v), "sha", hashlib.sha256(v.encode()).hexdigest()[:12] if v else "-", "stripped" if v == v.strip() else "HAS-WHITESPACE")
          body = json.dumps({"app_id": os.environ.get("FEISHU_APP_ID",""), "app_secret": os.environ.get("FEISHU_APP_SECRET","")}).encode()
          req = urllib.request.Request("https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal", data=body, headers={"Content-Type": "application/json"})
          tok = json.load(urllib.request.urlopen(req, timeout=15)).get("tenant_access_token")
          print("token ok:", bool(tok))
          ft = os.environ.get("FEISHU_DAILY_FOLDER_TOKEN", "")
          url = "https://open.feishu.cn/open-apis/drive/v1/files?" + urllib.parse.urlencode({"folder_token": ft, "page_size": 200})
          try:
              resp = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": "Bearer " + tok}), timeout=15))
              print("files code:", resp.get("code"), "count:", len(resp.get("data", {}).get("files", [])))
          except urllib.error.HTTPError as e:
              print("files http", e.code, e.read()[:300].decode("utf-8", "replace"))
          sp = os.environ.get("FEISHU_WIKI_SPACE_ID", "")
          try:
              resp = json.load(urllib.request.urlopen(urllib.request.Request(f"https://open.feishu.cn/open-apis/wiki/v2/spaces/{sp}/nodes?page_size=20", headers={"Authorization": "Bearer " + tok}), timeout=15))
              print("wiki code:", resp.get("code"), "count:", len(resp.get("data", {}).get("items", [])))
              for it in resp.get("data", {}).get("items", [])[:5]:
                  print("  wiki:", it.get("title"), it.get("node_token"))
          except urllib.error.HTTPError as e:
              print("wiki http", e.code, e.read()[:300].decode("utf-8", "replace"))
          PY

      # data/ holds paper_store.json (pushed/discarded dedup) and research_state.json.
      # Runners are ephemeral, so restore the newest snapshot and save a new one every run.
      - name: Restore pipeline state
        if: ${{ !inputs.diagnose }}
        uses: actions/cache/restore@v4
        with:
          path: data
          key: paper-daily-state-${{ github.run_id }}
          restore-keys: |
            paper-daily-state-

      - name: Run Paper Daily pipeline
        if: ${{ !inputs.diagnose }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEYS: ${{ secrets.LLM_API_KEYS }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DAILY_FOLDER_TOKEN: ${{ secrets.FEISHU_DAILY_FOLDER_TOKEN }}
          FEISHU_NOTES_FOLDER_TOKEN: ${{ secrets.FEISHU_NOTES_FOLDER_TOKEN }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
          FEISHU_DAILY_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_DAILY_PARENT_NODE_TOKEN }}
          FEISHU_CANDIDATE_NODE_TOKEN: ${{ secrets.FEISHU_CANDIDATE_NODE_TOKEN }}
          FEISHU_NOTES_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_NOTES_PARENT_NODE_TOKEN }}
          FEISHU_MASTER_INDEX_NODE_TOKEN: ${{ secrets.FEISHU_MASTER_INDEX_NODE_TOKEN }}
          FEISHU_TAG_GRAPH_NODE_TOKEN: ${{ secrets.FEISHU_TAG_GRAPH_NODE_TOKEN }}
          FEISHU_IDEA_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_IDEA_PARENT_NODE_TOKEN }}
          FEISHU_EXPERIMENT_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_EXPERIMENT_PARENT_NODE_TOKEN }}
          FEISHU_SYNTHESIS_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_SYNTHESIS_PARENT_NODE_TOKEN }}
          FEISHU_ENGINEERING_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_ENGINEERING_PARENT_NODE_TOKEN }}
          FEISHU_CONSOLE_NODE_TOKEN: ${{ secrets.FEISHU_CONSOLE_NODE_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          NOTION_CONSOLE_PAGE_ID: ${{ vars.NOTION_CONSOLE_PAGE_ID }}
          CONSOLE_PROVIDER: ${{ vars.CONSOLE_PROVIDER || 'auto' }}
          FEISHU_DRY_RUN: "false"
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          TRANSLATION_ENABLED: ${{ vars.TRANSLATION_ENABLED || 'true' }}
          TRANSLATION_API_BASE: ${{ vars.TRANSLATION_API_BASE || 'https://integrate.api.nvidia.com/v1' }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_BACKUP_API_KEY: ${{ secrets.TRANSLATION_BACKUP_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || 'z-ai/glm-5.3-flash' }}
          CUSTOM_CONFIG: ${{ secrets.CUSTOM_CONFIG }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'true' }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER || 'smtp.qq.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          WECHAT_ENABLED: ${{ vars.WECHAT_ENABLED || 'false' }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_THUMB_MEDIA_ID: ${{ secrets.WECHAT_THUMB_MEDIA_ID }}
          WECHAT_AUTHOR: ${{ vars.WECHAT_AUTHOR || 'Feishu Paper Daily' }}
          WECHAT_CONTENT_SOURCE_URL: ${{ vars.WECHAT_CONTENT_SOURCE_URL }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%s\n" "$CUSTOM_CONFIG" > config/custom.yaml
          fi

          # Schedule breakdown:
          # - 09:00 Beijing Time (01:00 UTC): Full pipeline (ingest checked + daily literature recommendation)
          # - 15:00 & 19:00 Beijing Time (07:00 & 11:00 UTC): Scheduled ingestion of user-checked papers
          CURRENT_HOUR=$(date -u +%H)
          if [ "${{ inputs.ingest_only }}" = "true" ]; then
            echo "Running in ingest-only mode (manual dispatch)"
            export INGEST_ONLY="true"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$CURRENT_HOUR" -gt 3 ]; then
            echo "Running scheduled ingestion at $(date) (UTC hour $CURRENT_HOUR, ingest-only)"
            export INGEST_ONLY="true"
          else
            echo "Running full pipeline at $(date) (UTC hour $CURRENT_HOUR)"
          fi

          uv run src/zotero_arxiv_daily/main.py

      - name: Save pipeline state
        if: always() && !inputs.diagnose
        uses: actions/cache/save@v4
        with:
          path: data
          key: paper-daily-state-${{ github.run_id }}
