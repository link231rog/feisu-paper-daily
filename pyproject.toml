[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[project]
name = "zotero-arxiv-daily"
version = "1.0.0"
description = "Automated daily literature pipeline delivering research papers, question briefs, and AI annotations to Feishu, email, and WeChat."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=2.4.0",
    "edge-tts>=6.1.12",
    "feedparser>=6.0.11",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "lxml>=5.0.0",
    "markdown>=3.6",
    "numpy>=1.26.0",
    "openai>=2.24.0",
    "premailer>=3.10.0",
    "pymupdf-layout>=1.27.1",
    "pymupdf4llm>=0.3.4",
    "python-dotenv>=1.0.0",
    "pyzotero>=1.10.0",
    "requests>=2.32.0",
    "scikit-learn>=1.7.1",
    "sentence-transformers>=5.2.3",
    "tiktoken>=0.8.0",
    "torch",
    "trafilatura>=2.0.0",
    "wechatpy>=1.8.18",
]

[project.scripts]
paper-daily = "zotero_arxiv_daily.main:main"
paper-library = "zotero_arxiv_daily.library:main"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.0.0",
]
